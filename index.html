.stem.sug{border-color:var(--line);border-left-color:var(--gold);background:rgba(236,201,121,.07)}
.tx{margin:0;font-size:18px;line-height:1.5}
.bl{color:var(--gold);border-bottom:2px solid var(--gold);padding:0 6px;margin:0 2px}
.stem textarea{min-height:44px;height:44px;margin-top:8px;resize:none;overflow:hidden;padding:10px 12px}

textarea#out{display:block;min-height:320px;max-height:70vh;resize:vertical}

function sync(){let t=st.text;
L.forEach((x,i)=>{const s=fill(i),p=st.pv[i];if(s===p)return;const at=p!=null?t.indexOf(p):-1;
if(at>=0){if(s!=null)t=t.slice(0,at)+s+t.slice(at+p.length);else{let e=at+p.length;if(t[e]===" ")e++;t=(t.slice(0,at)+t.slice(e)).replace(/ +\n/g,"\n").replace(/\n{3,}/g,"\n\n").replace(/^\s+/,"")}}
else if(s!=null)t=ins(t,i,s);
st.pv[i]=s});
st.text=t;$("out").value=t}
const tx=[],tas=[],secs=[],list=$("list"),chips=$("chips");
const fit=t=>{t.style.height="auto";t.style.height=Math.max(44,t.scrollHeight)+"px"};
function tick(){L.forEach((x,i)=>{const p=tx[i],q=pr(x);p.textContent="";q.forEach((t,k)=>{p.append(t.split("{N}").join(nm()));if(k<x.n){const b=document.createElement("b");b.className="bl";b.textContent="…";p.append(b)}})})}
S.forEach((s,k)=>{const sec=document.createElement("section");sec.id="sec"+k;sec.innerHTML='<div class="sec"></div><div class="lens"></div>';secs[k]=sec;list.append(sec);
const b=document.createElement("button");b.className="chip";b.textContent=k+1;b.onclick=()=>sec.scrollIntoView({behavior:"smooth",block:"start"});chips.append(b)});
L.forEach((x,i)=>{const d=document.createElement("div");d.className="stem";d.id="st"+i;const p=document.createElement("p");p.className="tx";tx[i]=p;d.append(p);tas[i]=[];
for(let k=0;k<x.n;k++){const t=document.createElement("textarea");t.value=st.a[i][k];t.rows=1;
t.addEventListener("input",()=>{st.a[i][k]=t.value;fit(t);sync();paint();save()});d.append(t);tas[i].push(t)}
secs[x.s].append(d)});
E.forEach(g=>{const b=document.createElement("button");b.className="eb";b.dataset.g=g;b.onclick=()=>{mode=mode===g?"":g;mark(true)};$("entry").append(b)});
function mark(go){[...$("entry").children].forEach(b=>b.classList.toggle("on",b.dataset.g===mode));let f=-1;L.forEach((x,i)=>{const on=mode&&x.g.includes(mode);$("st"+i).classList.toggle("sug",!!on);if(on&&f<0)f=i});
if(go&&f>=0){$("st"+f).scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>tas[f][0].focus({preventScroll:true}),400)}}
function paint(){const t=st.text.trim();$("wc").textContent=(t?t.split(/\s+/).length:0)+u().w;
[...chips.children].forEach((b,k)=>b.classList.toggle("done",L.some((x,i)=>x.s===k&&st.a[i].some(v=>v.trim()))))}
function applyLang(){const U_=u();document.documentElement.lang=st.lang;
document.querySelectorAll(".lb").forEach(b=>b.classList.toggle("on",b.dataset.l===st.lang));
$("sub").textContent=U_.sub;$("what").textContent=U_.what;$("namelbl").textContent=U_.nl;$("name").placeholder=U_.np;$("sidet").textContent=U_.side;$("clr").textContent=U_.clr;$("cpy").textContent=U_.cpy;$("out").placeholder=U_.op;
[...$("entry").children].forEach((b,i)=>b.textContent=U_.ent[i]);
S.forEach((s,k)=>{const t=st.lang==="ru"?RT[k]:[s[0],s[1]];secs[k].children[0].textContent=t[0];secs[k].children[1].textContent=t[1];chips.children[k].title=t[0];chips.children[k].setAttribute("aria-label",t[0])});
L.forEach((x,i)=>tas[i].forEach((t,k)=>{t.placeholder=x.n>1?U_.bl+" "+(k+1)+"…":"…";t.setAttribute("aria-label",pr(x).join("…").replace("{N}",nm()))}));tick()}
document.querySelectorAll(".lb").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;applyLang();sync();paint();save()});
$("name").value=st.name;$("out").value=st.text;
$("name").addEventListener("input",e=>{st.name=e.target.value;tick();sync();paint();save()});
$("out").addEventListener("input",e=>{st.text=e.target.value;paint();save()});
$("cpy").onclick=async()=>{const t=st.text;if(!t.trim())return;try{await navigator.clipboard.writeText(t)}catch(e){$("out").select();try{document.execCommand("copy")}catch(_){}}
$("cpy").textContent=u().cd;setTimeout(()=>$("cpy").textContent=u().cpy,1600)};
$("clr").onclick=()=>{if(!armed){armed=1;$("clr").textContent=u().sure;setTimeout(()=>{armed=0;$("clr").textContent=u().clr},2500);return}
armed=0;$("clr").textContent=u().clr;st=fresh(st.lang);$("name").value="";$("out").value="";tas.flat().forEach(t=>{t.value="";fit(t)});tick();paint();save()};
$("up").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
$("dn").onclick=()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
applyLang();paint();tas.flat().forEach(fit);
</script>
